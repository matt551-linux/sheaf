name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-pdfium.mjs
      - run: pnpm check
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            pdfium: linux-x64
            args: ""
          - os: ubuntu-22.04-arm
            pdfium: linux-arm64
            args: ""
          - os: windows-latest
            pdfium: win-x64
            args: ""
          - os: windows-11-arm
            pdfium: win-arm64
            args: ""
          - os: macos-latest
            pdfium: mac-univ
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux Tauri prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-pdfium.mjs ${{ matrix.pdfium }}
      - name: Stage PDFium next to the binary
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          cp src-tauri/pdfium/${{ matrix.pdfium }}/*pdfium.* src-tauri/resources/ || true
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: sheaf-${{ matrix.pdfium }}
          path: |
            src-tauri/target/**/release/bundle/**/*
            !src-tauri/target/**/release/bundle/**/*.pdb
