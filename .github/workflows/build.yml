name: build
# Manual only. Pushes and tags do NOT start runs; releases are built
# locally with scripts/release-local.sh until the Actions minute budget
# allows otherwise. Trigger from the Actions tab when wanted.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-pdfium.mjs
      - run: pnpm check
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Full five-platform bundle build: on version tags and manual dispatch only.
  # Ordinary pushes to main just run the test job above.
  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            pdfium: linux-x64
            args: ""
          - os: ubuntu-22.04-arm
            pdfium: linux-arm64
            args: ""
          - os: windows-latest
            pdfium: win-x64
            args: ""
          - os: windows-11-arm
            pdfium: win-arm64
            args: ""
          - os: macos-latest
            pdfium: mac-univ
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.pdfium }}
      - name: Linux Tauri prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-pdfium.mjs ${{ matrix.pdfium }}
      - name: Stage PDFium next to the binary
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          cp src-tauri/pdfium/${{ matrix.pdfium }}/*pdfium.* src-tauri/resources/ || true
      # Build and sign bundles first (no release), so artifacts always exist.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: sheaf-${{ matrix.pdfium }}
          path: |
            src-tauri/target/**/release/bundle/**/*
            !src-tauri/target/**/release/bundle/**/*.pdb

  # One job assembles latest.json from every platform's signatures and
  # attaches everything to a draft release for the tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Collect installers and write latest.json
        shell: bash
        run: node scripts/release-manifest.mjs bundles dist "${{ github.ref_name }}" "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sheaf ${{ github.ref_name }}
          draft: true
          prerelease: true
          body: "Installers for Windows (x64, ARM64), macOS (universal), and Linux (x64, ARM64: .deb for Debian/Ubuntu, .rpm for Fedora/RHEL/openSUSE, .AppImage for Arch/Omarchy/anything else). Installed copies update themselves from this page. Builds are not code-signed: Windows SmartScreen and macOS Gatekeeper will warn on first launch."
          files: dist/*
