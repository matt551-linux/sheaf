[package]
name = "sheaf"
version = "0.1.0"
description = "Sheaf: an open-source PDF reader and editor"
authors = ["Brian Haywood"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "sheaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["image_025", "pdfium_7543", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
parking_lot = "0.12"
base64 = "0.22"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
