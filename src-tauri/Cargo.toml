[package]
name = "sheaf"
version = "0.2.1"
description = "Sheaf: an open-source PDF reader and editor"
authors = ["Brian Haywood"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "sheaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["image_025", "pdfium_7543", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
parking_lot = "0.12"
base64 = "0.22"
# M5 sign and protect (pure Rust; no clang/ring needed)
lopdf = "0.44"
pdf_oxide = { version = "0.3.77", default-features = false, features = ["signatures"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
x509-parser = "0.16"
p12-keystore = "0.3"
sha2 = "0.10"
rand = "0.8"
# M7 tools
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = "0.26"
similar = "3"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"], optional = true }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2.3.1"

[features]
default = ["ocr-download"]
# Fetch OCR models over HTTPS (native TLS: SChannel / Security.framework / OpenSSL).
ocr-download = ["dep:ureq"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
